name: build

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Emby.Xtream.sln -c Release

      - name: Test
        run: dotnet test Emby.Xtream.sln -c Release --no-build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Emby.Xtream
          path: src/Emby.Xtream/bin/Release/netstandard2.0/Emby.Xtream.dll
          if-no-files-found: error

  release:
    # a v* tag publishes the plugin dll as a GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the project version
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/Emby.Xtream/Emby.Xtream.csproj | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in Emby.Xtream.csproj" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: Emby.Xtream

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Emby.Xtream.dll --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
