name: build

on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build Emby.Xtream.sln -c Release

      - name: Test
        run: dotnet test Emby.Xtream.sln -c Release --no-build

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: Emby.Xtream
          path: src/Emby.Xtream/bin/Release/netstandard2.0/Emby.Xtream.dll
          if-no-files-found: error
